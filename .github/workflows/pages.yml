name: Collect, encrypt & publish

# One workflow does everything so plaintext never reaches the repository or Pages:
#   restore encrypted state -> decrypt in the runner -> collect -> re-encrypt -> deploy.
# Repository → Settings → Pages → Source must be "GitHub Actions".
on:
  workflow_dispatch:
    inputs:
      collect:
        description: 'Run a collection scan before publishing'
        type: boolean
        default: true
  schedule:
    - cron: '12 * * * *'   # hourly, best effort
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'auth.js'
      - 'applications.js'
      - 'github-scan.js'
      - 'assets/**'
      - 'config/users.json'
      - 'vault/**'
      - 'collector/**'
      - 'server/**'
      - 'data/sources.json'
      - 'data/ats.json'
      - 'data/custom_feeds.json'
      - 'data/search_queries.json'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  checks: write
  pages: write
  id-token: write

concurrency:
  group: cybercareers-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CC_MASTER_KEY: ${{ secrets.CC_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check complete release upload
        # Inline so a partial upload cannot omit the checker itself. This reads
        # public code paths only, before dependencies, keys or job data are used.
        run: |
          python - <<'PY'
          from pathlib import Path
          required = (
              'requirements.txt', 'index.html', 'styles.css', 'app.js', 'auth.js',
              'applications.js', 'github-scan.js', 'assets/favicon.svg',
              'collector/__init__.py', 'collector/ci.py', 'collector/github_progress.py',
              'collector/collect.py', 'collector/telemetry.py', 'collector/relevance.py',
              'collector/vacancy.py', 'collector/textmine.py', 'collector/robots.py',
              'collector/render.py', 'collector/ats.py', 'collector/free_feeds.py',
              'collector/custom_feeds.py', 'collector/email_alerts.py', 'collector/search_apis.py',
              'server/__init__.py', 'server/app.py',
              'vault/__init__.py', 'vault/__main__.py', 'vault/backup.py',
          )
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              print('::error::Incomplete release upload. Missing runtime files: ' + ', '.join(missing) +
                    '. Upload the complete release folders together, preserving your existing vault and user configuration.')
              raise SystemExit(1)
          print('Required release runtime files are present.')
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check release compatibility
        run: |
          python - <<'PY'
          import contextlib
          import importlib
          import inspect
          import os
          import re
          import sys
          from pathlib import Path

          problems, modules = [], {}
          def require(label, check):
              try:
                  valid = bool(check())
              except (Exception, SystemExit):
                  valid = False
              if not valid:
                  problems.append(label)

          def flush_private(*streams):
              for stream in streams:
                  try:
                      stream.flush()
                  except (AttributeError, OSError, ValueError):
                      pass
              try:
                  import ctypes
                  flush = ctypes.CDLL(None).fflush
                  flush.argtypes = [ctypes.c_void_p]
                  flush.restype = ctypes.c_int
                  flush(None)
              except (ImportError, AttributeError, OSError):
                  pass

          # Imports are inspected, never executed as collection entrypoints.
          # Suppress Python and native import output; report fixed labels only.
          original_streams = (sys.stdout, sys.stderr, sys.__stdout__, sys.__stderr__)
          sink = None
          saved = [os.dup(fd) for fd in (1, 2)]
          try:
              with open(os.devnull, 'w') as sink:
                  for fd in (1, 2):
                      os.dup2(sink.fileno(), fd)
                  with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                      for name in ('collector.collect', 'collector.telemetry', 'collector.github_progress',
                                   'collector.ci', 'vault', 'vault.backup', 'server.app'):
                          try:
                              modules[name] = importlib.import_module(name)
                          except (Exception, SystemExit):
                              problems.append('cannot import ' + name)
                      require('collector callback interface', lambda:
                              {'on_progress', 'force_feeds'} <= set(inspect.signature(modules['collector.collect'].run).parameters))
                      require('source progress interface', lambda: all(callable(getattr(
                              modules['collector.telemetry'].CollectionTelemetry, name, None))
                              for name in ('plan_sources', 'started', 'snapshot')))
                      for name in ('collector.ci', 'collector.github_progress', 'vault.backup'):
                          require(name + ' entrypoint', lambda name=name: callable(getattr(modules[name], 'main', None)))
                      assets = {'app.js', 'auth.js', 'applications.js', 'github-scan.js'}
                      require('vault frontend assets', lambda: assets <= set(modules['vault'].SITE_FILES))
                      require('server frontend assets', lambda: assets <= set(modules['server.app'].PUBLIC_ROOT_FILES))
                      require('live progress decryption export', lambda: re.search(
                              r'export\s+async\s+function\s+decryptLiveProgress\b', Path('auth.js').read_text(encoding='utf-8')))
                      require('live scan frontend import', lambda: re.search(
                              r"import\s*\{[^}]*\bcreateGitHubScanner\b[^}]*\}\s*from\s*['\"]\./github-scan\.js(?:\?[^'\"]*)?['\"]",
                              Path('app.js').read_text(encoding='utf-8')))
          finally:
              # Buffered original Python streams and native printf must flush
              # while descriptors still point to the null device.
              flush_private(sink, *original_streams, sys.stdout, sys.stderr, sys.__stdout__, sys.__stderr__)
              for fd, original in zip((1, 2), saved):
                  os.dup2(original, fd)
                  os.close(original)
          if problems:
              print('::error::Incomplete release upload or incompatible runtime: ' + '; '.join(problems) +
                    '. Upload the complete release together; keep your existing vault and user configuration.')
              raise SystemExit(1)
          print('Release runtime interfaces are compatible.')
          PY
      - name: Test (code only; never depends on live data)
        run: python -m pytest -q -p no:cacheprovider
      - name: Require the vault master key
        run: |
          if [ -z "$CC_MASTER_KEY" ]; then
            echo "::error::Add the CC_MASTER_KEY repository secret (python -m vault init prints it)."; exit 1
          fi
      - name: Restore latest encrypted state (hourly cache)
        id: state-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: encrypted
          # The attempt changes on re-runs; cache entries are immutable.
          # Full ref + delimiter prevents matching a different branch's state.
          key: cc-v2-vault-${{ github.ref }}::${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: 'cc-v2-vault-${{ github.ref }}::'
      - name: Restore previous cache format on first upgrade
        if: steps.state-cache.outputs.cache-matched-key == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: encrypted
          key: cc-vault-${{ github.run_id }}
          restore-keys: cc-vault-
      - name: Decrypt collector state inside the runner
        run: python -m vault unseal
      - name: Optional JavaScript rendering support
        if: vars.RENDER_JS != '0'
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Collect cybersecurity vacancies
        id: collect
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          GH_PROGRESS_TOKEN: ${{ github.token }}
          MAX_FEED_SEARCHES: '6'
          MAX_CAREER_PAGES: '250'
          MAX_DETAIL_PAGES: '450'
          MAX_LISTING_PAGES: ${{ vars.MAX_LISTING_PAGES || '8' }}
          ATS_MAX_PAGES: ${{ vars.ATS_MAX_PAGES || '10' }}
          ATS_MAX_DETAILS: ${{ vars.ATS_MAX_DETAILS || '100' }}
          MAX_JOB_AGE_DAYS: '45'
          COLLECT_WORKERS: '8'
          RENDER_JS: ${{ vars.RENDER_JS || '1' }}
          ALERT_IMAP_HOST: ${{ vars.ALERT_IMAP_HOST }}
          ALERT_IMAP_FOLDER: ${{ vars.ALERT_IMAP_FOLDER }}
          ALERT_IMAP_USER: ${{ secrets.ALERT_IMAP_USER }}
          ALERT_IMAP_PASSWORD: ${{ secrets.ALERT_IMAP_PASSWORD }}
          ALERT_LOOKBACK_DAYS: ${{ vars.ALERT_LOOKBACK_DAYS || '21' }}
          ALERT_MAX_MESSAGES: ${{ vars.ALERT_MAX_MESSAGES || '500' }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          BRAVE_QUERIES_PER_RUN: ${{ vars.BRAVE_QUERIES_PER_RUN || '2' }}
          BRAVE_PAGES_PER_QUERY: ${{ vars.BRAVE_PAGES_PER_QUERY || '2' }}
          BRAVE_MAX_REQUESTS_PER_RUN: ${{ vars.BRAVE_MAX_REQUESTS_PER_RUN || '2' }}
          BRAVE_MONTHLY_REQUEST_LIMIT: ${{ vars.BRAVE_MONTHLY_REQUEST_LIMIT || '1500' }}
          BRAVE_FRESHNESS: ${{ vars.BRAVE_FRESHNESS }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JOOBLE_API_HOST: ${{ vars.JOOBLE_API_HOST }}
          JOOBLE_QUERIES_PER_RUN: ${{ vars.JOOBLE_QUERIES_PER_RUN || '3' }}
          JOOBLE_PAGES_PER_QUERY: ${{ vars.JOOBLE_PAGES_PER_QUERY || '3' }}
          JOOBLE_MAX_REQUESTS_PER_RUN: ${{ vars.JOOBLE_MAX_REQUESTS_PER_RUN || '4' }}
          JOOBLE_DAILY_REQUEST_LIMIT: ${{ vars.JOOBLE_DAILY_REQUEST_LIMIT || '96' }}
        # The wrapper suppresses private collector output and emits only safe
        # diagnostics, so failures remain actionable in public Actions logs.
        run: python -m collector.ci
      - name: Encrypt (fresh data key, per-user wrapped keys)
        id: seal
        run: python -m vault seal
      - name: Save encrypted state for the next hour
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: encrypted
          key: cc-v2-vault-${{ github.ref }}::${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build static site (ciphertext only)
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m vault build-site --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Back up encrypted state after successful deployment
        id: backup
        if: steps.deployment.outcome == 'success' && github.ref_type == 'branch'
        continue-on-error: true
        timeout-minutes: 5
        # Optional durability must not block publishing. This uses a separate
        # worktree, preserves concurrent changes, and never force-pushes.
        # Compare against the repository backup, not only the restored cache,
        # so a missed backup is retried even if no new jobs arrive next hour.
        run: python -m vault.backup
      - name: Report an interrupted collection after publishing its status
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::error::Collection was interrupted. The dashboard preserves its previous completion time and shows the failed attempt.'
          exit 1
